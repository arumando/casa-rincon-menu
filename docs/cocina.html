<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casa Rincón · Cocina</title>
  <meta name="theme-color" content="#0b120c">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body class="staff kitchen">
  <header class="k-head">
    <h1>Casa Rincón <small>Cocina</small></h1>
    <div class="k-resumen" id="resumen"></div>
    <div class="s-status" id="estado"></div>
    <div class="k-reloj" id="reloj"></div>
  </header>

  <section id="login" class="s-login" hidden>
    <h2>Monitor de cocina</h2>
    <p class="hint">Se configura una sola vez: escribe el PIN del restaurante.<br>Después la pantalla funciona sola.</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit"><span>Entrar</span></button>
    </form>
    <p class="errors" id="loginError" hidden></p>
  </section>

  <main id="app" class="k-main" hidden>
    <div id="tablero" class="k-tablero"></div>
  </main>

  <footer class="k-pie" id="recientes"></footer>
  <div class="k-tecla" id="tecla" hidden></div>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="cocina.js"></script>
</body>
</html>
