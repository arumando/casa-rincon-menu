<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casa Rincón · Cocina</title>
  <meta name="theme-color" content="#0b120c">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body class="staff kitchen">
  <header class="s-head">
    <div>
      <h1>Casa Rincón</h1>
      <p>Cocina</p>
    </div>
    <div class="k-reloj" id="reloj"></div>
    <div class="s-status" id="estado"></div>
  </header>

  <section id="login" class="s-login" hidden>
    <h2>Pantalla de cocina</h2>
    <p class="hint">Escribe el PIN del restaurante.</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit"><span>Entrar</span></button>
    </form>
    <p class="errors" id="loginError" hidden></p>
  </section>

  <main id="app" class="k-main" hidden>
    <nav class="s-filtros" id="filtros"></nav>
    <div id="tablero" class="k-tablero"></div>
  </main>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="cocina.js"></script>
</body>
</html>
