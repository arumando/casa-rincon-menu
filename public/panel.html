<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de pedidos · Casa Rincón</title>
  <meta name="theme-color" content="#0e1a11">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="panel">
  <div class="demo-ribbon">Demo · panel del restaurante · Milpa Digital</div>

  <header class="p-head">
    <div>
      <h1>Casa Rincón</h1>
      <p>Panel de pedidos</p>
    </div>
    <div class="p-status" id="estado"></div>
  </header>

  <section id="login" class="p-login" hidden>
    <h2>Entrar al panel</h2>
    <p class="hint">Escribe el PIN del restaurante.</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit"><span>Entrar</span></button>
    </form>
    <p class="errors" id="loginError" hidden>PIN incorrecto.</p>
  </section>

  <main id="app" class="p-main" hidden>
    <nav class="p-tabs" id="tabs"></nav>
    <div id="lista"></div>
  </main>

  <script src="panel.js"></script>
</body>
</html>
